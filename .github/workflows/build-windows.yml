name: Build PrismLauncher Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          qt-version: '6.8.3'

      - name: Configure
        shell: powershell
        run: |
          cmake --preset windows_msvc

      - name: Build
        shell: powershell
        run: |
          cmake --build --preset windows_msvc --config Release

      - name: Find PrismLauncher
        shell: powershell
        run: |
          Get-ChildItem -Path build -Recurse -Filter PrismLauncher.exe

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          $exe = Get-ChildItem -Path build -Recurse -Filter PrismLauncher.exe |
                 Select-Object -First 1

          if (-not $exe) {
              Write-Error "PrismLauncher.exe introuvable"
              exit 1
          }

          Copy-Item $exe.FullName artifact\PrismLauncher.exe

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path artifact\* `
            -DestinationPath PrismLauncher-Windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Windows
          path: PrismLauncher-Windows.zip